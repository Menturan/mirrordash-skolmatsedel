[project]
name = "mirrordash-skolmatsedel"
version = "0.10.0"
description = "School lunch menus from Skolmaten and Mateo"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MirrorDash Developer" }
]
# The mirror provides the rest (rendering, fetch_json, translations); add only what plugin.py imports
dependencies = []

[project.entry-points."mirrordash.modules"]
mirrordash_skolmatsedel = "mirrordash_skolmatsedel.plugin:SkolmatsedelModule"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jinja2>=3.1",  # the mirror's own, to draw the template in the tests
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_skolmatsedel"]
